<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Smart Porter</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:1rem;">
        <div class="logo" style="justify-content:center;">
          <div class="logo-icon">🧳</div>
          <span>Smart Porter</span>
        </div>
      </div>
      <h2>Welcome Back</h2>
      <p class="subtitle">Login to continue</p>

      <div class="role-tabs">
        <button type="button" class="role-tab active" data-role="PASSENGER">Passenger</button>
        <button type="button" class="role-tab" data-role="PORTER">Porter</button>
        <button type="button" class="role-tab" data-role="ADMIN">Admin</button>
      </div>

      <div id="alertBox"></div>

      <form id="loginForm">
        <input type="hidden" id="role" name="role" value="PASSENGER">
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-control" id="email" name="email" required placeholder="you@email.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Login</button>
      </form>

      <p style="text-align:center;margin-top:1.5rem;font-size:0.9rem;color:var(--gray-500);">
        Don't have an account? <a href="register.html" style="color:var(--orange);font-weight:600;">Sign Up</a>
      </p>

      <div style="margin-top:1.5rem;padding:1rem;background:var(--gray-50);border-radius:10px;font-size:0.8rem;color:var(--gray-500);">
        <strong>Demo Credentials:</strong><br>
        Passenger: rahul.sharma@email.com / passenger123<br>
        Porter: ramesh.porter@email.com / porter123<br>
        Admin: admin@smartporter.com / admin123
      </div>
    </div>
  </div>

  <script>
    // Role tabs
    document.querySelectorAll('.role-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('role').value = tab.dataset.role;
      });
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      alertBox.innerHTML = '';

      const formData = new FormData();
      formData.append('email', document.getElementById('email').value);
      formData.append('password', document.getElementById('password').value);
      formData.append('role', document.getElementById('role').value);

      try {
        const res = await fetch('../login', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
          alertBox.innerHTML = '<div class="alert alert-success">Login successful! Redirecting...</div>';
          // Store basic info for frontend (session is on server)
          sessionStorage.setItem('role', data.role);
          sessionStorage.setItem('name', data.name);
          setTimeout(() => {
            window.location.href = data.redirect || 'index.html';
          }, 800);
        } else {
          alertBox.innerHTML = '<div class="alert alert-danger">' + (data.message || 'Login failed') + '</div>';
        }
      } catch (err) {
        // Fallback for demo without backend
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const role = document.getElementById('role').value;
        if ((email === 'admin@smartporter.com' && pass === 'admin123' && role === 'ADMIN') ||
            (email.includes('porter') && pass === 'porter123' && role === 'PORTER') ||
            (pass === 'passenger123' && role === 'PASSENGER')) {
          sessionStorage.setItem('role', role);
          sessionStorage.setItem('name', email.split('@')[0]);
          sessionStorage.setItem('demo', 'true');
          let redirect = 'passenger-dashboard.html';
          if (role === 'PORTER') redirect = 'porter-dashboard.html';
          if (role === 'ADMIN') redirect = 'admin-dashboard.html';
          alertBox.innerHTML = '<div class="alert alert-success">Demo login successful!</div>';
          setTimeout(() => window.location.href = redirect, 600);
        } else {
          alertBox.innerHTML = '<div class="alert alert-danger">Invalid credentials or server offline. Use demo credentials.</div>';
        }
      }
    });
  </script>
</body>
</html>
